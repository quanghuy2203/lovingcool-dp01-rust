name: Rust Windows Build and Release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/lovingcool-dp01-studio.exe dist/
          Copy-Item update.ps1 dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath lovingcool-dp01-windows-x64.zip -Force
          (Get-FileHash -Algorithm SHA256 lovingcool-dp01-windows-x64.zip).Hash.ToLowerInvariant() | Out-File lovingcool-dp01-windows-x64.sha256 -NoNewline -Encoding ascii
      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: lovingcool-dp01-windows-x64
          path: |
            lovingcool-dp01-windows-x64.zip
            lovingcool-dp01-windows-x64.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lovingcool-dp01-windows-x64.zip
            lovingcool-dp01-windows-x64.sha256
