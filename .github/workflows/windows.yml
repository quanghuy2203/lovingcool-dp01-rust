name: Rust Windows Build and Release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/lovingcool-dp01-studio.exe dist/
          Copy-Item update.ps1 dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath lovingcool-dp01-windows-x64.zip -Force
          (Get-FileHash -Algorithm SHA256 lovingcool-dp01-windows-x64.zip).Hash.ToLowerInvariant() | Out-File lovingcool-dp01-windows-x64.sha256 -NoNewline -Encoding ascii
      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: lovingcool-dp01-windows-x64
          path: |
            lovingcool-dp01-windows-x64.zip
            lovingcool-dp01-windows-x64.sha256
      - name: Detect new application version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\\s*=\\s*"([^"]+)"' | Select-Object -First 1
          if (!$line) { throw 'Missing Cargo.toml package version' }
          $tag = "v" + $line.Matches[0].Groups[1].Value
          "tag=$tag" >> $env:GITHUB_OUTPUT
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) { "publish=false" >> $env:GITHUB_OUTPUT }
          else { "publish=true" >> $env:GITHUB_OUTPUT }
      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            lovingcool-dp01-windows-x64.zip
            lovingcool-dp01-windows-x64.sha256
